name: paper-bot
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
concurrency:
  group: paper-bot
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Load saved state
        run: |
          mkdir -p state
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch origin data --depth=1
            git show FETCH_HEAD:paper.db > state/paper.db
          fi
      - name: Run one paper-trading cycle
        env:
          POLY_DB: state/paper.db
          POLY_EXPORT: state/data.json
        run: python3 bot.py --once
      - name: Save state
        run: |
          cd state
          git init -q
          git checkout -q -b data
          git config user.name "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          git add paper.db data.json
          git commit -qm "state"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
